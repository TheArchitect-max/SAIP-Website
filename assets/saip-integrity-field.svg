<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 760" role="img" aria-labelledby="title desc">
  <title id="title">SAIP integrity field</title>
  <desc id="desc">An abstract conceptual illustration of concentric assurance layers around a protected decision core.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="58%">
      <stop offset="0" stop-color="#2d2116" stop-opacity=".92"/>
      <stop offset=".38" stop-color="#15110d" stop-opacity=".96"/>
      <stop offset="1" stop-color="#090807"/>
    </radialGradient>
    <radialGradient id="core" cx="45%" cy="38%" r="70%">
      <stop offset="0" stop-color="#f2d3a6"/>
      <stop offset=".22" stop-color="#d79f5b"/>
      <stop offset=".56" stop-color="#704722"/>
      <stop offset="1" stop-color="#1a120b"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8c08c" stop-opacity=".9"/>
      <stop offset=".42" stop-color="#7c4e27" stop-opacity=".28"/>
      <stop offset="1" stop-color="#e8c08c" stop-opacity=".06"/>
    </linearGradient>
    <filter id="blur18"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="blur8"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".7"/>
    </filter>
  </defs>

  <circle cx="380" cy="380" r="338" fill="url(#bg)" stroke="#8c6137" stroke-opacity=".16"/>
  <circle cx="380" cy="380" r="290" fill="none" stroke="url(#ring)" stroke-width="2" opacity=".42"/>
  <circle cx="380" cy="380" r="246" fill="none" stroke="#d4a063" stroke-opacity=".14" stroke-width="1.5" stroke-dasharray="3 10"/>
  <circle cx="380" cy="380" r="204" fill="none" stroke="#d4a063" stroke-opacity=".22" stroke-width="1.5"/>
  <circle cx="380" cy="380" r="158" fill="none" stroke="#e6bd85" stroke-opacity=".12" stroke-width="1" stroke-dasharray="2 12"/>

  <circle cx="380" cy="380" r="122" fill="#a3682c" opacity=".14" filter="url(#blur18)"/>
  <circle cx="380" cy="380" r="86" fill="url(#core)" filter="url(#shadow)"/>
  <circle cx="355" cy="350" r="18" fill="#fff4df" opacity=".22" filter="url(#blur8)"/>

  <g fill="#d9a66b">
    <circle cx="380" cy="90" r="4"/>
    <circle cx="585" cy="175" r="4" opacity=".76"/>
    <circle cx="670" cy="380" r="4" opacity=".58"/>
    <circle cx="585" cy="585" r="4" opacity=".66"/>
    <circle cx="380" cy="670" r="4" opacity=".48"/>
    <circle cx="175" cy="585" r="4" opacity=".66"/>
    <circle cx="90" cy="380" r="4" opacity=".58"/>
    <circle cx="175" cy="175" r="4" opacity=".76"/>
  </g>

  <g fill="none" stroke="#bc8246" stroke-opacity=".16" stroke-width="1">
    <path d="M380 90 L380 176"/>
    <path d="M585 175 L524 236"/>
    <path d="M670 380 L584 380"/>
    <path d="M585 585 L524 524"/>
    <path d="M380 670 L380 584"/>
    <path d="M175 585 L236 524"/>
    <path d="M90 380 L176 380"/>
    <path d="M175 175 L236 236"/>
  </g>

  <g font-family="ui-sans-serif,system-ui,sans-serif" text-anchor="middle" fill="#c8b8a4">
    <text x="380" y="374" font-size="11" letter-spacing="3" opacity=".75">DECISION</text>
    <text x="380" y="394" font-size="9" letter-spacing="2" opacity=".46">CORE</text>
  </g>

  <g font-family="ui-sans-serif,system-ui,sans-serif" fill="#7f7468" font-size="9" letter-spacing="1.8">
    <text x="380" y="190" text-anchor="middle">POLICY BOUNDARY</text>
    <text x="570" y="383">REVIEW STATE</text>
    <text x="380" y="574" text-anchor="middle">EVIDENCE CONTEXT</text>
    <text x="112" y="383">AUTHORIZATION</text>
  </g>
</svg>
