<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#080807">
  <title>Page not found — SAIP</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <style>
    .not-found{min-height:100svh;display:grid;place-items:center;background:radial-gradient(circle at 62% 32%,rgba(216,167,102,.12),transparent 28rem)}
    .not-found .shell{max-width:760px;padding-block:5rem}
    .not-found h1{max-width:9ch;margin:0;font-family:Georgia,"Times New Roman",serif;font-size:clamp(3.4rem,9vw,7rem);font-weight:400;line-height:.95;letter-spacing:-.04em}
    .not-found p:not(.section-kicker){max-width:52ch;margin:1.6rem 0 2rem;color:#aaa398}
    .not-found .button{width:auto}
  </style>
</head>
<body>
  <main class="not-found">
    <div class="shell">
      <p class="section-kicker">404 · SAIP</p>
      <h1>Nothing is exposed here.</h1>
      <p>The requested public page does not exist. Return to the SAIP project showcase.</p>
      <a class="button button-primary" href="./">Return to SAIP</a>
    </div>
  </main>
</body>
</html>
